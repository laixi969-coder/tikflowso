<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>tikflowso 研究助手</title>
<style>
*{box-sizing:border-box}
body{width:305px;margin:0;padding:20px;font:14px/1.5 system-ui,sans-serif;color:#212c29;background:#f5f7f5}
h1{margin:0 0 14px;font-size:23px;letter-spacing:-1px}
label,button,input{display:block;width:100%}
p{overflow-wrap:anywhere}
label{font-size:12px;font-weight:600}
input{margin:5px 0 12px;border-radius:7px;border:1px solid #a8b5ad;padding:8px;font:inherit}
button{padding:9px;background:#145d49;color:white;border:0;border-radius:7px;font:inherit;font-weight:650;cursor:pointer}
#message{font-size:12px;color:#34493c;margin-bottom:0}
</style>
<h1>tikflowso</h1>
<p id="selection">正在识别当前标签页…</p>
<form id="open">
<label for="workspace">工作区地址</label>
<input id="workspace" type="url" required value="http://127.0.0.1:8765">
<button type="submit" disabled>在工作区查找</button>
</form>
<p id="message" role="status"></p>
<script src="identify.js"></script>
<script src="popup.js"></script>
</html>
